[package]
name = "zmng"
version = "0.1.0"
edition = "2021"
description = "ZoneMinder NG: passthrough segment recorder, substream motion detection, instant timeline/event browsing"
license = "GPL-2.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
tower = { version = "0.5", features = ["util"] }
hyper = "1"
http = "1"
http-body-util = "0.1"
bytes = "1"
retina = "0.4"
url = "2"
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
argon2 = "0.5"
rand = "0.9"
hex = "0.4"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
parking_lot = "0.12"
libc = "0.2"
rumqttc = "0.25.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart"] }

[profile.release]
opt-level = 3
debug = 1
lto = "thin"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
tempfile = "3.27.0"
