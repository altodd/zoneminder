# Home Assistant recipes for zmng.
#
# 1. MQTT (nothing to declare): with [mqtt] configured in zmng.toml every camera is
#    discovered as a device with binary_sensor.<name>_motion, binary_sensor.<name>_recording,
#    sensor.<name>_last_event (attributes = the latest event JSON: id, score, kind, objects; thumb once the thumbnail exists)
#    and camera.<name>_last_event_thumbnail.
#
# 2. Pictures. The MQTT camera entity (camera.<name>_last_event_thumbnail) needs no token
#    and shows the latest event. For live stills the generic camera platform cannot send an
#    Authorization header, so the token would have to go in the URL (it then shows up in
#    Caddy and HA logs). If you do that, create a dedicated *viewer* account limited to the
#    cameras HA needs and issue a token that acts as it (Admin -> API tokens, "acts as"
#    that viewer), never an admin token. Revoke it there if it leaks:
# camera:
#   - platform: generic
#     name: Front Door
#     still_image_url: https://security.church.example/api/cameras/1/snapshot.jpg?width=1280&token=VIEWER_TOKEN
#     verify_ssl: true

# 3. Health as a sensor (issues count) polled every minute:
sensor:
  - platform: rest
    name: zmng issues
    resource: https://security.church.example/api/status
    headers:
      Authorization: Bearer YOUR_LONG_LIVED_TOKEN
    value_template: "{{ value_json.issues | length }}"
    json_attributes:
      - issues
      - uptime_secs
    scan_interval: 60

# 4. Automations. event_start has no picture yet; objects arrive with event_update, and the
#    thumbnail exists after event_end (announced by one more event_update with `thumb` set).
automation:
  - alias: Front door person at night
    trigger:
      - platform: mqtt
        topic: zmng/camera/1/event
    condition:
      - condition: template
        value_template: "{{ trigger.payload_json.event == 'event_update' and 'person' in (trigger.payload_json.objects | map(attribute='label') | list) }}"
      - condition: sun
        after: sunset
    action:
      - service: notify.mobile_app_phone
        data:
          message: "Person at the front door"
          data:
            # the MQTT camera entity holds the event thumbnail once it exists; no token needed
            entity_id: camera.front_door_last_event_thumbnail

  - alias: Camera down
    trigger:
      - platform: state
        entity_id: binary_sensor.front_door_recording
        to: "off"
        for: "00:05:00"
    action:
      - service: notify.mobile_app_phone
        data:
          message: "Front Door has not recorded for 5 minutes"

# 5. Alternatively, without MQTT: alert_webhook = "https://ha.local/api/webhook/zmng" in zmng.toml
#    and a webhook trigger; the JSON body is the same notification object
#    ({"event": "event_start" | "event_end" | "camera_down" | "camera_up" | "storage_low", ...}).
